<div id="wrap">
  <div class="row">
    <input id="url" type="text" placeholder="https://raw.githubusercontent.com/KULLANICI/fmatches-runner-scripts/main/latest.js" />
    <button id="fetchrun" class="primary">Fetch &amp; Run</button>
  </div>
  <div id="meta">Hazır.</div>
  <textarea id="code" placeholder="Kod buraya çekilir. Elle yapıştırıp Ctrl+Enter ile de çalıştırabilirsin."></textarea>
  <div class="row">
    <button id="fetchonly">Fetch only</button>
    <button id="run">Run (Ctrl+Enter)</button>
    <button id="clear">Clear</button>
    <button id="copy">Copy result</button>
  </div>
  <pre id="out"></pre>
</div>

<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 12px -apple-system, "Segoe UI", sans-serif; color: var(--figma-color-text); background: var(--figma-color-bg); }
  #wrap { display: flex; flex-direction: column; gap: 8px; padding: 10px; height: 100vh; }
  .row { display: flex; gap: 6px; }
  input, textarea, pre {
    background: var(--figma-color-bg-secondary); color: var(--figma-color-text);
    border: 1px solid var(--figma-color-border); border-radius: 6px; padding: 7px 9px;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px;
  }
  input { flex: 1; }
  textarea { flex: 1; min-height: 160px; resize: none; white-space: pre; overflow: auto; }
  pre { height: 120px; margin: 0; overflow: auto; white-space: pre-wrap; }
  button { border: 1px solid var(--figma-color-border); background: var(--figma-color-bg); color: var(--figma-color-text);
    border-radius: 6px; padding: 7px 12px; cursor: pointer; font-size: 11px; }
  button:hover { background: var(--figma-color-bg-hover); }
  button.primary { background: var(--figma-color-bg-brand); color: var(--figma-color-text-onbrand); border-color: transparent; }
  #meta { font-size: 11px; color: var(--figma-color-text-secondary); min-height: 15px; }
  .err { color: var(--figma-color-text-danger); }
</style>

<script>
  var $ = function (id) { return document.getElementById(id); };
  var post = function (m) { parent.postMessage({ pluginMessage: m }, '*'); };

  post({ type: 'load-url' });

  function setMeta(text, isErr) {
    $('meta').textContent = text;
    $('meta').className = isErr ? 'err' : '';
  }

  // First line of the script is a marker comment, e.g. "// step 59 · ticker variants"
  function marker(src) {
    var first = (src.split('\n')[0] || '').trim();
    return first.indexOf('//') === 0 ? first.replace(/^\/\/\s*/, '') : '(adım notu yok)';
  }

  function doFetch() {
    var url = $('url').value.trim();
    if (!url) { setMeta('Önce script adresini yaz.', true); return Promise.reject(); }
    post({ type: 'save-url', url: url });
    // cache buster: CDN eski sürümü vermesin
    var bust = url + (url.indexOf('?') === -1 ? '?' : '&') + 't=' + Date.now();
    setMeta('Çekiliyor...');
    return fetch(bust, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (src) {
        $('code').value = src;
        setMeta('Çekildi: ' + marker(src) + '  ·  ' + src.length + ' karakter');
        return src;
      })
      .catch(function (e) {
        setMeta('Çekilemedi: ' + e.message, true);
        throw e;
      });
  }

  function run() {
    var code = $('code').value;
    if (!code.trim()) { setMeta('Kod yok.', true); return; }
    $('out').textContent = 'Çalışıyor...';
    post({ type: 'run', code: code });
  }

  $('fetchonly').onclick = function () { doFetch().catch(function () {}); };
  $('fetchrun').onclick = function () { doFetch().then(run).catch(function () {}); };
  $('run').onclick = run;
  $('clear').onclick = function () { $('code').value = ''; $('out').textContent = ''; setMeta('Hazır.'); };
  $('copy').onclick = function () {
    var t = document.createElement('textarea');
    t.value = $('out').textContent;
    document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t);
    setMeta('Sonuç kopyalandı.');
  };

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); e.shiftKey ? $('fetchrun').click() : run(); }
  });

  onmessage = function (event) {
    var msg = event.data && event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'url') { $('url').value = msg.url || ''; return; }
    if (msg.type === 'result') {
      $('out').textContent = (msg.ok ? 'OK' : 'ERROR') + ' (' + msg.ms + ' ms)\n\n' + msg.text;
      $('out').className = msg.ok ? '' : 'err';
    }
  };
</script>
